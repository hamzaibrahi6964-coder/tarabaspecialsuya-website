<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h2 style="color:white;">Admin Dashboard</h2>
</nav>

<section class="orders-section">

<h2>All Orders</h2>

<div id="orders"></div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseClient = supabase.createClient(
"https://kjbebnahxuupolrcmlwv.supabase.co",
"sb_publishable_2wbjQwggFVO4DkeZIULNoA_lpFniGZ_"
)

async function loadOrders(){

const { data, error } = await supabaseClient
.from("orders")
.select("*")
.order("created_at", { ascending: false })

let container = document.getElementById("orders")
container.innerHTML = ""

if(!data || data.length === 0){
container.innerHTML = "<p>No orders yet</p>"
return
}

data.forEach(order => {

container.innerHTML += `
<div class="order-card">

<h3>Order #${order.order_no}</h3>

<p><b>Name:</b> ${order.name}</p>
<p><b>Phone:</b> ${order.phone}</p>
<p><b>Food:</b> ${order.food}</p>
<p><b>Qty:</b> ${order.quantity}</p>

<p><b>Status:</b> ${order.status}</p>
<p><b>Payment:</b> ${order.payment}</p>

<p><b>Ordered:</b> ${new Date(order.created_at).toLocaleString()}</p>

${order.completed_at ? 
`<p><b>Ready:</b> ${new Date(order.completed_at).toLocaleString()}</p>` 
: ""}

${
order.status !== "ready" ? 
`<button onclick="markAsReady('${order.id}')">Mark Ready</button>` 
: `<button disabled>Completed</button>`
}

</div>
`

})

}

loadOrders()

async function markAsReady(orderId){

const { error } = await supabaseClient
.from("orders")
.update({
status: "ready",
completed_at: new Date().toISOString()
})
.eq("id", orderId)

if(error){
alert("Error: " + error.message)
return
}

alert("Order marked as READY")

loadOrders()

}

supabaseClient
.channel('orders-channel')
.on(
'postgres_changes',
{
event: '*',
schema: 'public',
table: 'orders'
},
(payload) => {

console.log("Change received!", payload)

loadOrders()

if(payload.eventType === "INSERT"){
alert("🔴 New Order Received!")
}

}
)
.subscribe()

</script>

</body>
</html>
