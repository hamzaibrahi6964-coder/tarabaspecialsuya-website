<section class="order-section">

<h2>Place Your Order</h2>

<form id="orderForm">

<label>Name</label>
<input type="text" id="name" required>

<label>Phone</label>
<input type="text" id="phone" required>

<label>Food</label>
<select id="food">
<option>Beef Suya</option>
<option>Chicken Suya</option>
<option>Kebab</option>
<option>Fruite</option>
<option>Milkshake</option>  
</select>

<label>Quantity</label>
<input type="number" id="quantity" value="1">

<label>Delivery Type</label>
<select id="delivery">
<option>Pickup</option>
<option>Home Delivery</option>
</select>

<label>Address</label>
<input type="text" id="address">

<button type="submit">Place Order</button>

</form>

</section>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseClient = supabase.createClient(
"https://kjbebnahxuupolrcmlwv.supabase.co",
"sb_publishable_2wbjQwggFVO4DkeZIULNoA_lpFniGZ_"
)

document.getElementById("orderForm").addEventListener("submit", async function(e){

e.preventDefault()

let name = document.getElementById("name").value
let phone = document.getElementById("phone").value
let food = document.getElementById("food").value
let quantity = document.getElementById("quantity").value
let address = document.getElementById("address").value

localStorage.setItem("customerPhone", phone)

let orderNumber = Math.floor(Math.random()*9000)+1000

const { error } = await supabaseClient
.from("orders")
.insert([
{
order_no: orderNumber,
name: name,
phone: phone,
food: food,
quantity: quantity,
address: address,
status: "new",
payment: "pending"
}
])

if(error){
alert("Order failed: " + error.message)
return
}

localStorage.setItem("order_no",orderNumber)
localStorage.setItem("name",name)
localStorage.setItem("phone",phone)
localStorage.setItem("food",food)
localStorage.setItem("quantity",quantity)
localStorage.setItem("address",address)

window.location.href="order-success.html"

})

</script>

</body>
