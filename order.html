<section class="section">
<h2>Place Order</h2>

<form id="orderForm">

<label>Name</label><br>
<input type="text" id="name"><br><br>

<label>Phone</label><br>
<input type="text" id="phone"><br><br>

<label>Food</label><br>
<select id="food">
<option>Beef Suya</option>
<option>Chicken Suya</option>
<option>Kilishi</option>
</select><br><br>

<button class="btn-primary">Submit Order</button>

</form>

<p id="result"></p>

</section>

<script>

document.getElementById("orderForm").addEventListener("submit", function(e){
e.preventDefault();

let order = "TS-" + Math.floor(Math.random()*10000);

document.getElementById("result").innerHTML =
"Order received. Verification Number: " + order;

});

</script>
