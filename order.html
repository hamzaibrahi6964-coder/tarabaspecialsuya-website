<section class="order-section">

<h2>Place Your Order</h2>

<form id="orderForm">

<label>Your Name</label>
<input type="text" id="name" required>

<label>Phone Number</label>
<input type="text" id="phone" required>

<label>Select Item</label>
<select id="food">
<option>Beef Suya</option>
<option>Chicken Suya</option>
<option>Kebab</option>
<option>Kilishi</option>
</select>

<label>Quantity</label>
<input type="number" id="quantity" min="1" value="1">

<button type="submit" class="btn-primary">Place Order</button>

</form>

<p id="orderMessage"></p>

</section>

<script>

document.getElementById("orderForm").addEventListener("submit", function(e){

e.preventDefault();

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let food = document.getElementById("food").value;
let quantity = document.getElementById("quantity").value;

let orderNumber = Math.floor(Math.random()*10000);

let message = "New Order%0A"+
"Order No: "+orderNumber+"%0A"+
"Name: "+name+"%0A"+
"Phone: "+phone+"%0A"+
"Food: "+food+"%0A"+
"Quantity: "+quantity;

window.open("https://wa.me/2348069233181?text="+message);

});

</script>
