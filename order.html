<section class="order-section">

<option>Chicken Suya</option>
<option>Kebab</option>
</select>

<label>Quantity</label>
<input type="number" id="quantity" value="1">

<label>Delivery Type</label>
<select id="delivery">
<option>Pickup</option>
<option>Home Delivery</option>
</select>

<label>Address</label>
<input type="text" id="address">

<button type="button" onclick="payNow()">Pay & Place Order</button>

</section>


<script>

e.preventDefault();

let quantity = document.getElementById("quantity").value;

"Quantity: "+quantity;

window.open("https://wa.me/2348069233181?text="+message);

});

</script>
