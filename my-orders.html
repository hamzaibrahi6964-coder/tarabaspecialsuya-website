<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<nav>

Taraba <span>Special Suya</span>

<div class="menu-icon" onclick="openMenu()">☰</div>
</nav>

<div class="mobile-menu" id="mobileMenu">
<span onclick="closeMenu()" class="close-menu">✕</span>

<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="order.html">Order</a>

<a href="profile.html">Profile</a>

</div>

<section class="orders-section">

<h2>My Orders</h2>

<div id="orders"></div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseClient = supabase.createClient(
"https://kjbebnahxuupolrcmlwv.supabase.co",
"sb_publishable_2wbjQwggFVO4DkeZIULNoA_lpFniGZ_"
)

// MENU
function openMenu(){
document.getElementById("mobileMenu").style.right = "0";
}

function closeMenu(){
document.getElementById("mobileMenu").style.right = "-260px";
}

// LOAD ORDERS
async function loadOrders(){

let user = JSON.parse(localStorage.getItem("user"))

if(!user){
alert("Please login first")
window.location.href="login.html"
return
}

const { data, error } = await supabaseClient
.from("orders")
.select("*")
.eq("user_id", user.id)
.order("created_at", { ascending: false })

let container = document.getElementById("orders")

container.innerHTML = ""

if(!data || data.length === 0){
container.innerHTML = "<p>No orders yet</p>"
return
}

data.forEach(order => {

container.innerHTML += `
<div class="order-card">
<h3>Order #${order.order_no}</h3>

<p><b>Food:</b> ${order.food}</p>
<p><b>Quantity:</b> ${order.quantity}</p>

<p><b>Status:</b> ${order.status}</p>
<p><b>Payment:</b> ${order.payment}</p>

<p><b>Ordered:</b> ${new Date(order.created_at).toLocaleString()}</p>

${order.completed_at ? 
`<p><b>Ready:</b> ${new Date(order.completed_at).toLocaleString()}</p>` 
: ""}

</div>
`

})

}

loadOrders()

</script>

</body>
</html>
