<div class="orders-container">

<h2>My Orders</h2>

<input type="text" id="phoneSearch" placeholder="Enter your phone number">

<button onclick="loadMyOrders()">Check Orders</button>

<div id="orders"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseClient = supabase.createClient(
"https://kjbebnahxuupolrcmlwv.supabase.co",
"sb_publishable_2wbjQwggFVO4DkeZIULNoA_lpFniGZ_"
)

async function loadMyOrders(){

let phone = document.getElementById("phoneSearch").value

const { data, error } = await supabaseClient
.from("orders")
.select("*")
.eq("phone", phone)
.order("created_at",{ascending:false})

if(error){
alert(error.message)
return
}

let container = document.getElementById("orders")

container.innerHTML=""

data.forEach(order => {

container.innerHTML += `

<div class="order-card">

<h3>Order #${order.order_no}</h3>

<p><b>Food:</b> ${order.food}</p>
<p><b>Quantity:</b> ${order.quantity}</p>
<p><b>Status:</b> ${order.status}</p>
<p><b>Payment:</b> ${order.payment}</p>

</div>

`

})

}

</script>
