<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <a href="index.html" class="logo">
    Taraba <span>Special Suya</span>
  </a>

  <div class="menu-icon" onclick="openMenu()">☰</div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <span onclick="closeMenu()" class="close-menu">✕</span>

  <a href="index.html">Home</a>
  <a href="menu.html">Menu</a>
  <a href="order.html">Order</a>
  <a href="my-orders.html">My Orders</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
  <a href="signup.html">Signup</a>
  <a href="login.html">Login</a>
  <a href="profile.html">Profile</a>
</div>

<section class="profile-page">
  <div class="profile-wrapper">

    <div class="profile-header-box">
      <h1>My Profile</h1>
      <p>Manage your account details and personal information</p>
    </div>

    <div class="profile-card-pro">
      <div class="profile-image-area">
        <img id="profileImage" src="https://via.placeholder.com/140" class="profile-img-pro">
        <label for="imageUpload" class="upload-btn">Upload Photo</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>

      <div class="profile-info-area">
        <div class="profile-email-box">
          <span>Email Address</span>
          <h2 id="userEmail">Loading...</h2>
        </div>

        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name">
        </div>

        <div class="input-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" placeholder="Enter your phone number">
        </div>

        <div class="profile-actions">
          <button class="save-btn-pro" onclick="saveProfile()">Save Profile</button>
          <button class="logout-btn-pro" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://kjbebnahxuupolrcmlwv.supabase.co",
  "sb_publishable_2wbjQwggFVO4DkeZIULNoA_lpFniGZ_"
);

let user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  alert("Please login first");
  window.location.href = "login.html";
}

function openMenu() {
  document.getElementById("mobileMenu").style.right = "0";
}

function closeMenu() {
  document.getElementById("mobileMenu").style.right = "-260px";
}

async function loadProfile() {
  document.getElementById("userEmail").innerText = user.email;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (data) {
    document.getElementById("fullName").value = data.full_name || "";
    document.getElementById("phone").value = data.phone || "";

    localStorage.setItem("fullName", data.full_name || "");
    localStorage.setItem("phone", data.phone || "");
  } else {
    document.getElementById("fullName").value = localStorage.getItem("fullName") || "";
    document.getElementById("phone").value = localStorage.getItem("phone") || "";
  }
}

loadProfile();

async function saveProfile() {
  let name = document.getElementById("fullName").value.trim();
  let phone = document.getElementById("phone").value.trim();

  if (!name || !phone) {
    alert("Please fill in your full name and phone number");
    return;
  }

  const { error } = await supabaseClient
    .from("profiles")
    .upsert([
      {
        id: user.id,
        email: user.email,
        full_name: name,
        phone: phone
      }
    ]);

  if (error) {
    alert("Failed to save profile: " + error.message);
    return;
  }

  localStorage.setItem("fullName", name);
  localStorage.setItem("phone", phone);

  alert("Profile saved successfully!");
}

function logout() {
  localStorage.removeItem("user");
  window.location.href = "login.html";
}

document.getElementById("imageUpload").addEventListener("change", function(e) {
  let file = e.target.files[0];

  if (file) {
    let reader = new FileReader();

    reader.onload = function() {
      document.getElementById("profileImage").src = reader.result;
      localStorage.setItem("profileImage", reader.result);
    };

    reader.readAsDataURL(file);
  }
});

let savedImage = localStorage.getItem("profileImage");
if (savedImage) {
  document.getElementById("profileImage").src = savedImage;
}
</script>

</body>
</html>
